name: no_01 cache mode reusable callee

on:
  workflow_call:
    inputs:
      cache_key:
        description: Unique key for the called-workflow probe
        required: true
        type: string

permissions:
  contents: read

jobs:
  request-write:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Ask CacheService for a write URL from the read-capped call
        uses: actions/github-script@v8
        env:
          NO_01_CACHE_KEY: ${{ inputs.cache_key }}
        with:
          script: |
            const crypto = require('crypto')
            const key = process.env.NO_01_CACHE_KEY
            const version = crypto.createHash('sha256')
              .update('no_01-cache-mode-reusable-v1').digest('hex')
            const endpoint = new URL(
              '/twirp/github.actions.results.api.v1.CacheService/CreateCacheEntry',
              process.env.ACTIONS_RESULTS_URL)
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.ACTIONS_RUNTIME_TOKEN}`,
                'content-type': 'application/json'
              },
              body: JSON.stringify({key, version})
            })
            const body = await response.json()
            const proof = {
              mode: process.env.ACTIONS_CACHE_MODE || '',
              status: response.status,
              ok: Boolean(body.ok),
              upload_url_present: Boolean(body.signed_upload_url),
              upload_url_hash: body.signed_upload_url
                ? crypto.createHash('sha256').update(body.signed_upload_url).digest('hex')
                : '',
              message: body.message || ''
            }
            core.info(`NO_01_CALLEE_WRITE_REQUEST=${JSON.stringify(proof)}`)
